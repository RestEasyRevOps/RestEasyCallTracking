<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Reps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg-dark: #223129;
        --color-box-translucent: rgba(255, 255, 255, 0.05);
        --color-sage-accent: #4C9170;
        --color-mint-soft: #8DC4AA;
        --text-on-dark: #f8fafc;
        --danger: #ef4444;
        --focus-glow: rgba(76, 145, 112, 0.2);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; font-family: 'Manrope', system-ui, sans-serif;
        background: var(--color-bg-dark); color: var(--text-on-dark);
        display: flex; justify-content: center; padding: 48px 20px;
    }
    h1 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; margin: 0 0 8px; }
    p.subtitle { margin: 0 0 28px; font-size: 13px; color: var(--color-mint-soft); }
    #page { width: 100%; max-width: 480px; }
    .form-section {
        background: var(--color-box-translucent); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px; padding: 24px; margin-bottom: 20px;
    }
    .add-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
    .add-row input[type="text"]:first-child { flex: 1 1 160px; }
    input {
        flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-family: inherit;
        border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.15); color: #fff;
    }
    input:focus { border-color: var(--color-sage-accent); outline: none; box-shadow: 0 0 0 3px var(--focus-glow); }
    button {
        background: var(--color-sage-accent); color: #fff; border: none; padding: 12px 18px;
        border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px;
    }
    button:hover { background: #3d7a5c; }
    .rep-row {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .rep-row:last-child { border-bottom: none; }
    .rep-name { font-size: 15px; }
    .rep-name.inactive { color: rgba(248,250,252,0.4); text-decoration: line-through; }
    .rep-left { display: flex; align-items: center; gap: 10px; }
    .rep-pin {
        font-family: 'Manrope', monospace; font-size: 12px; letter-spacing: 1px;
        color: var(--color-mint-soft); background: rgba(0,0,0,0.2);
        padding: 4px 9px; border-radius: 6px; cursor: pointer; border: 1px dashed transparent;
    }
    .rep-pin:hover { border-color: rgba(255,255,255,0.25); }
    .rep-pin.pin-missing { color: rgba(248,250,252,0.4); font-style: italic; letter-spacing: normal; }
    .rep-actions button { padding: 6px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-toggle { background: rgba(255,255,255,0.1); margin-right: 6px; }
    .btn-toggle:hover { background: rgba(255,255,255,0.18); }
    .btn-secondary { background: rgba(255,255,255,0.1); flex: 0 0 auto; }
    .btn-secondary:hover { background: rgba(255,255,255,0.18); }
    .btn-delete { background: var(--danger); }
    .btn-delete:hover { background: #dc2626; }
    #status { margin-top: 12px; font-size: 13px; min-height: 18px; }
    #status.error { color: var(--danger); }
    #status.success { color: var(--color-mint-soft); }
    .empty-note { color: rgba(248,250,252,0.5); font-size: 13px; }
</style>
</head>
<body>

<div id="page">
    <h1>Manage Reps</h1>
    <p class="subtitle">Reps added here can log in immediately with their PIN. Marking a rep inactive hides them from new submissions without deleting their history. Click a rep's PIN below to change it.</p>

    <div class="form-section">
        <div class="add-row">
            <input type="text" id="new-rep-name" placeholder="New rep name">
            <input type="text" id="new-rep-pin" placeholder="4-digit PIN" inputmode="numeric" maxlength="4" style="flex: 0 0 120px;">
            <button type="button" class="btn-secondary" onclick="generatePin()">Generate</button>
            <button type="button" onclick="addRep()">Add</button>
        </div>
        <div id="status"></div>
    </div>

    <div class="form-section" id="rep-list">
        <div class="empty-note">Loading...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDgIjCM2kFe4VSpniRNHXJTvNJDOo7tjgQ",
        authDomain: "resteasycalltracking.firebaseapp.com",
        projectId: "resteasycalltracking",
        storageBucket: "resteasycalltracking.firebasestorage.app",
        messagingSenderId: "744235430121",
        appId: "1:744235430121:web:aa650ff3b7a3b570844078",
        measurementId: "G-8VGJSMTXP6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Awaited before every Firestore call below — signing in is async, and
    // querying/writing before it settles can produce a spurious "Missing or
    // insufficient permissions" error even when the rules are correct.
    const authReady = signInAnonymously(auth).catch((err) => {
        console.error('Anonymous sign-in failed:', err);
        throw err;
    });

    const repList = document.getElementById('rep-list');
    const status = document.getElementById('status');
    const newRepInput = document.getElementById('new-rep-name');
    const newPinInput = document.getElementById('new-rep-pin');

    // Escapes a value for safe interior use inside an HTML attribute
    // built via string interpolation (onclick="...('${...}')").
    function attrSafe(str) {
        return String(str ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    async function loadReps() {
        await authReady;
        const q = query(collection(db, 'reps'), orderBy('name'));
        const snap = await getDocs(q);
        if (snap.empty) {
            repList.innerHTML = '<div class="empty-note">No reps yet — add one above.</div>';
            return;
        }
        repList.innerHTML = '';
        snap.forEach((docSnap) => {
            const data = docSnap.data();
            const pinLabel = data.pin ? data.pin : 'Set PIN';
            const row = document.createElement('div');
            row.className = 'rep-row';
            row.innerHTML = `
                <span class="rep-left">
                    <span class="rep-name ${data.active === false ? 'inactive' : ''}">${data.name}</span>
                    <span class="rep-pin ${data.pin ? '' : 'pin-missing'}" title="Click to change PIN"
                        onclick="window.__editPin('${docSnap.id}', '${attrSafe(data.name)}', '${attrSafe(data.pin || '')}')">${pinLabel}</span>
                </span>
                <span class="rep-actions">
                    <button class="btn-toggle" onclick="window.__toggleRep('${docSnap.id}', ${data.active === false})">${data.active === false ? 'Reactivate' : 'Deactivate'}</button>
                    <button class="btn-delete" onclick="window.__deleteRep('${docSnap.id}', '${attrSafe(data.name)}')">Delete</button>
                </span>
            `;
            repList.appendChild(row);
        });
    }

    // Returns the set of PINs currently in use (across active AND inactive
    // reps, so a deactivated rep's old PIN can't be accidentally handed
    // to someone else while their history still references it).
    async function pinsInUse(excludeId) {
        await authReady;
        const snap = await getDocs(collection(db, 'reps'));
        const map = new Map(); // pin -> name
        snap.forEach((d) => {
            if (d.id === excludeId) return;
            const p = d.data().pin;
            if (p) map.set(String(p), d.data().name);
        });
        return map;
    }

    window.generatePin = async function () {
        const used = await pinsInUse(null);
        let candidate;
        do {
            candidate = String(Math.floor(1000 + Math.random() * 9000));
        } while (used.has(candidate));
        newPinInput.value = candidate;
    };

    window.__editPin = async function (id, name, currentPin) {
        const next = prompt(`4-digit PIN for ${name}:`, currentPin || '');
        if (next === null) return; // cancelled
        const trimmed = next.trim();
        if (!/^\d{4}$/.test(trimmed)) {
            alert('PIN must be exactly 4 digits.');
            return;
        }
        const used = await pinsInUse(id);
        if (used.has(trimmed)) {
            alert(`That PIN is already assigned to ${used.get(trimmed)}. Choose a different one.`);
            return;
        }
        try {
            await updateDoc(doc(db, 'reps', id), { pin: trimmed });
            status.textContent = `PIN updated for ${name}.`;
            status.className = 'success';
            loadReps();
        } catch (err) {
            console.error(err);
            status.textContent = 'Could not update PIN — check Firebase config.';
            status.className = 'error';
        }
    };

    window.addRep = async function () {
        const name = newRepInput.value.trim();
        const pin = newPinInput.value.trim();
        if (!name) return;

        if (pin && !/^\d{4}$/.test(pin)) {
            status.textContent = 'PIN must be exactly 4 digits — or leave it blank and set one later.';
            status.className = 'error';
            return;
        }

        try {
            if (pin) {
                const used = await pinsInUse(null);
                if (used.has(pin)) {
                    status.textContent = `PIN ${pin} is already assigned to ${used.get(pin)}.`;
                    status.className = 'error';
                    return;
                }
            }
            await addDoc(collection(db, 'reps'), { name, active: true, pin: pin || null });
            newRepInput.value = '';
            newPinInput.value = '';
            status.textContent = pin ? `${name} added with PIN ${pin}.` : `${name} added — no PIN set yet, click "Set PIN" below to add one.`;
            status.className = 'success';
            loadReps();
        } catch (err) {
            console.error(err);
            status.textContent = 'Could not add rep — check Firebase config.';
            status.className = 'error';
        }
    };

    window.__toggleRep = async function (id, reactivate) {
        await authReady;
        await updateDoc(doc(db, 'reps', id), { active: reactivate });
        loadReps();
    };

    window.__deleteRep = async function (id, name) {
        if (!confirm(`Delete ${name}? This only removes them from the rep list — their past submissions are untouched.`)) return;
        await authReady;
        await deleteDoc(doc(db, 'reps', id));
        loadReps();
    };

    loadReps().catch((err) => {
        console.error('Could not load reps:', err);
        repList.innerHTML = '<div class="empty-note" style="color:var(--danger);">Could not load reps — check that Anonymous Authentication is enabled and Firestore rules are published.</div>';
    });
</script>

</body>
</html>
