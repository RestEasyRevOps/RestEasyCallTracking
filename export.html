<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export Call Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --color-bg-dark: #223129;
        --color-box-translucent: rgba(255, 255, 255, 0.05);
        --color-sage-accent: #4C9170;
        --color-mint-soft: #8DC4AA;
        --text-on-dark: #f8fafc;
        --focus-glow: rgba(76, 145, 112, 0.2);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; font-family: 'Manrope', system-ui, sans-serif;
        background: var(--color-bg-dark); color: var(--text-on-dark);
        display: flex; justify-content: center; padding: 48px 20px;
    }
    h1 { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; margin: 0 0 8px; }
    p.subtitle { margin: 0 0 28px; font-size: 13px; color: var(--color-mint-soft); }
    #page { width: 100%; max-width: 480px; }
    .form-section {
        background: var(--color-box-translucent); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px; padding: 24px;
    }
    .form-group { margin-bottom: 18px; }
    .grid-2 { display: flex; gap: 15px; margin-bottom: 18px; }
    .grid-2 .form-group { flex: 1; margin-bottom: 0; }
    label {
        display: block; font-weight: 600; margin-bottom: 8px; font-size: 11px;
        text-transform: uppercase; color: var(--color-mint-soft); letter-spacing: 0.5px;
    }
    input[type="date"], select {
        width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-family: inherit;
        border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.15); color: #fff;
    }
    select { cursor: pointer; }
    .field-note { font-size: 11px; color: rgba(248,250,252,0.5); margin: 6px 0 0; }
    button {
        width: 100%; background: var(--color-sage-accent); color: #fff; border: none; padding: 16px;
        font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer;
        text-transform: uppercase; letter-spacing: 1px;
    }
    button:hover { background: #3d7a5c; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; color: var(--color-mint-soft); }
    #status.error { color: #ef4444; }
</style>
</head>
<body>

<div id="page">
    <h1>Export Call Data</h1>
    <p class="subtitle">Pick what to export, choose a date range (optional), and download it as a CSV.</p>

    <div class="form-section">
        <div class="form-group">
            <label for="export-type">Export</label>
            <select id="export-type"></select>
            <p class="field-note" id="export-type-note"></p>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="date-from">From</label>
                <input type="date" id="date-from">
            </div>
            <div class="form-group">
                <label for="date-to">To</label>
                <input type="date" id="date-to">
            </div>
        </div>
        <button type="button" id="export-btn" onclick="runExport()">Download CSV</button>
        <div id="status"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Same config as index.html and admin.html - keep all three in sync.
    const firebaseConfig = {
        apiKey: "AIzaSyA74tKBbA3cKHCwiI8FVZpvxR9gpGeMOCU",
        authDomain: "resteasycalltracking-b6441.firebaseapp.com",
        projectId: "resteasycalltracking-b6441",
        storageBucket: "resteasycalltracking-b6441.firebasestorage.app",
        messagingSenderId: "202833392651",
        appId: "1:202833392651:web:eff40e11f8b89aab39430e",
        measurementId: "G-2WC8RZW39P"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Awaited before any export query — signing in is async, and querying
    // before it settles can produce a spurious "Missing or insufficient
    // permissions" error even when the rules are correct.
    const authReady = signInAnonymously(auth).catch((err) => {
        console.error('Anonymous sign-in failed:', err);
        throw err;
    });

    const statusEl = document.getElementById('status');
    const exportBtn = document.getElementById('export-btn');
    const exportTypeSel = document.getElementById('export-type');
    const exportTypeNote = document.getElementById('export-type-note');

    // ------------------------------------------------------------------
    // Shared helpers
    // ------------------------------------------------------------------
    function tsToDate(ts) {
        return ts && ts.toDate ? ts.toDate() : null;
    }

    function formatDate(d) {
        if (!d) return '';
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${mm}/${dd}/${d.getFullYear()}`;
    }

    function inRange(ts, fromDate, toDate) {
        const d = tsToDate(ts);
        if (fromDate && d && d < fromDate) return false;
        if (toDate && d && d > toDate) return false;
        // Records with no timestamp are never excluded by a date filter,
        // matching the original export's behavior.
        return true;
    }

    // A sale can come in from either submission path:
    //  - Outbound Sale Submission: saleDetails lives at the top level
    //  - Inbound Call -> Inbound Sales Opportunity -> Sold: saleDetails
    //    lives nested under inboundSales
    function isOutboundSale(data) {
        return data.submissionType === 'outbound_sale_submission';
    }
    function isInboundSoldSale(data) {
        return data.submissionType === 'inbound_call'
            && data.callType === 'inbound_sales'
            && data.inboundSales
            && data.inboundSales.outcome === 'sold';
    }
    function getSaleDetails(data) {
        if (isOutboundSale(data)) return data.saleDetails || null;
        if (isInboundSoldSale(data)) return data.inboundSales.saleDetails || null;
        return null;
    }

    // ------------------------------------------------------------------
    // Generic flattener + CSV writer, kept for any future "export
    // everything" style export.
    // ------------------------------------------------------------------
    function flatten(obj, prefix = '', out = {}) {
        for (const [key, value] of Object.entries(obj || {})) {
            const flatKey = prefix ? `${prefix}.${key}` : key;
            if (Array.isArray(value)) {
                value.forEach((item, i) => {
                    const itemKey = `${flatKey}.${i}`;
                    if (item && typeof item === 'object') {
                        flatten(item, itemKey, out);
                    } else {
                        out[itemKey] = item ?? '';
                    }
                });
            } else if (value && typeof value === 'object' && !value.toDate) {
                flatten(value, flatKey, out);
            } else if (value && value.toDate) {
                out[flatKey] = value.toDate().toISOString();
            } else {
                out[flatKey] = value ?? '';
            }
        }
        return out;
    }

    function escapeCSV(val) {
        const s = String(val ?? '');
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    // headers: explicit, ordered column list. If omitted, headers are
    // collected from the union of all row keys (in first-seen order) —
    // used by the generic/raw export.
    function toCSV(rows, headers) {
        if (!rows.length) return '';
        const cols = headers || (() => {
            const seen = [];
            const have = new Set();
            rows.forEach((r) => Object.keys(r).forEach((k) => { if (!have.has(k)) { have.add(k); seen.push(k); } }));
            return seen;
        })();
        const lines = [cols.map(escapeCSV).join(',')];
        rows.forEach((r) => {
            lines.push(cols.map((h) => escapeCSV(r[h])).join(','));
        });
        return lines.join('\n');
    }

    // ------------------------------------------------------------------
    // EXPORT DEFINITIONS
    // Each export type declares its CSV headers (in column order) and a
    // buildRows(docs, fromDate, toDate) function that returns row objects
    // keyed by those exact header names. Add new export types here.
    // ------------------------------------------------------------------
    const EXPORT_TYPES = {

        sales_details: {
            label: 'Sales Details',
            note: 'One row per package sold. A sale with multiple packages produces multiple rows.',
            filenamePrefix: 'sales-details',
            headers: [
                'Customer Name', 'Phone Number', 'Date', 'Package',
                'Initial Price', 'Monthly Price', 'Annual Value',
                'Sale Type', 'Lead Type', 'Sales Rep'
            ],
            buildRows(docs, fromDate, toDate) {
                const rows = [];
                docs.forEach((data) => {
                    const sd = getSaleDetails(data);
                    if (!sd || !Array.isArray(sd.packages) || !sd.packages.length) return;
                    if (!inRange(data.timestamp, fromDate, toDate)) return;

                    const outbound = isOutboundSale(data);
                    const saleType = outbound ? 'Outbound' : 'Inbound';
                    // Lead Type only exists for Outbound Sale Submissions
                    // (leadSource). Inbound Sales Opportunities don't
                    // capture a lead source, so this is left blank there.
                    const leadType = outbound ? (data.leadSource || '') : '';
                    const dateStr = formatDate(tsToDate(data.timestamp));

                    sd.packages.forEach((pkg) => {
                        rows.push({
                            'Customer Name': data.customerName || '',
                            'Phone Number': data.customerPhone || '',
                            'Date': dateStr,
                            'Package': pkg.package || '',
                            'Initial Price': pkg.initialPrice != null ? pkg.initialPrice : '',
                            'Monthly Price': pkg.monthlyPrice != null ? pkg.monthlyPrice : '',
                            'Annual Value': pkg.revenue != null ? pkg.revenue : '',
                            'Sale Type': saleType,
                            'Lead Type': leadType,
                            'Sales Rep': data.salesRep || ''
                        });
                    });
                });
                return rows;
            }
        },

        raw_all: {
            label: 'Everything (raw)',
            note: 'Every submission, every field, flattened into one column per field. Use this if you need something not covered by another export.',
            filenamePrefix: 'call-data-export',
            headers: null, // auto-detected from data
            buildRows(docs, fromDate, toDate) {
                const rows = [];
                docs.forEach((data, i) => {
                    if (!inRange(data.timestamp, fromDate, toDate)) return;
                    rows.push(flatten(data));
                });
                return rows;
            }
        }
    };

    // Populate the dropdown from EXPORT_TYPES
    function populateExportTypes() {
        exportTypeSel.innerHTML = Object.entries(EXPORT_TYPES)
            .map(([key, def]) => `<option value="${key}">${def.label}</option>`)
            .join('');
        updateNote();
    }
    function updateNote() {
        const def = EXPORT_TYPES[exportTypeSel.value];
        exportTypeNote.textContent = def ? def.note : '';
    }
    exportTypeSel.addEventListener('change', updateNote);
    populateExportTypes();

    window.runExport = async function () {
        exportBtn.disabled = true;
        statusEl.textContent = 'Pulling data...';
        statusEl.className = '';

        try {
            const def = EXPORT_TYPES[exportTypeSel.value];
            if (!def) throw new Error('Unknown export type');

            await authReady;
            const q = query(collection(db, 'submissions'), orderBy('timestamp'));
            const snap = await getDocs(q);

            const fromVal = document.getElementById('date-from').value;
            const toVal = document.getElementById('date-to').value;
            const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
            const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;

            const docs = [];
            snap.forEach((docSnap) => docs.push({ id: docSnap.id, ...docSnap.data() }));

            const rows = def.buildRows(docs, fromDate, toDate);

            if (!rows.length) {
                statusEl.textContent = 'No matching submissions found in that range.';
                statusEl.className = 'error';
                return;
            }

            const csv = toCSV(rows, def.headers);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${def.filenamePrefix}-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);

            statusEl.textContent = `Downloaded ${rows.length} rows.`;
        } catch (err) {
            console.error(err);
            statusEl.textContent = 'Export failed — check the console and your Firebase config.';
            statusEl.className = 'error';
        } finally {
            exportBtn.disabled = false;
        }
    };
</script>

</body>
</html>
